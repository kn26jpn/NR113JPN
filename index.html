<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家計簿 DashBoard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- トークン未設定警告 -->
  <div id="auth-error" class="card danger-card hidden">
    認証トークンが見つかりません。URLに <code>?token=YOUR_TOKEN</code> を付与してアクセスしてください。
  </div>

  <!-- ローディングオーバーレイ -->
  <div id="loading" class="loading-overlay hidden">
    <div class="spinner"></div>
    <p>データを読み込み中...</p>
  </div>

  <div class="app-container">
    <!-- ヘッダー＆月選択 -->
    <header class="header">
      <h1>家計簿</h1>
      <div class="month-selector">
        <button id="prev-month-btn" class="icon-btn">◀</button>
        <span id="current-month-display">2026-07</span>
        <button id="next-month-btn" class="icon-btn">▶</button>
      </div>
    </header>

    <!-- 当月サマリーカード -->
    <section class="summary-grid">
      <div class="summary-card expense">
        <h3>総支出</h3>
        <p id="total-expense">¥0</p>
      </div>
      <div class="summary-card income">
        <h3>総収入</h3>
        <p id="total-income">¥0</p>
      </div>
      <div class="summary-card savings">
        <h3>貯蓄・投資</h3>
        <p id="total-savings">¥0</p>
      </div>
    </section>

    <!-- 明細リスト表示エリア -->
    <section class="details-section">
      <h2>今月の明細一覧</h2>
      <div id="data-list" class="data-list">
        <!-- JSで動的に明細要素を追加 -->
      </div>
    </section>
  </div>

  <!-- フローティングアクションボタン (FAB) -->
  <div class="fab-container">
    <button id="fab-main" class="fab-main">+</button>
    <div id="fab-menu" class="fab-menu hidden">
      <button class="fab-item" data-type="expense">支出</button>
      <button class="fab-item" data-type="income">収入</button>
      <button class="fab-item" data-type="savings">貯蓄</button>
      <button class="fab-item" data-type="investment">投資</button>
    </div>
  </div>

  <!-- モーダルダイアログ（入力フォーム） -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">新規登録</h3>
        <button id="modal-close" class="close-btn">&times;</button>
      </div>
      <form id="entry-form">
        <input type="hidden" id="entry-type">
        
        <div class="form-group">
          <label>日付</label>
          <input type="date" id="entry-date" required>
        </div>

        <div class="form-group">
          <label>カテゴリー</label>
          <select id="entry-category" required></select>
        </div>

        <div class="form-group" id="group-payment-method">
          <label>支払方法</label>
          <select id="entry-payment-method">
            <option value="現金">現金</option>
            <option value="三井住友">三井住友</option>
            <option value="エポス">エポス</option>
            <option value="JRE">JRE</option>
            <option value="ポイント">ポイント</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <div class="form-group">
          <div class="label-with-action">
            <label>金額</label>
            <button type="button" id="income-picker-btn" class="mini-btn hidden">💰 直近収入から入力</button>
          </div>
          <!-- 直近収入選択ドロップダウン（隠し要素） -->
          <select id="recent-income-select" class="hidden-picker hidden"></select>
          <input type="number" id="entry-amount" placeholder="0" required>
        </div>

        <div class="form-group">
          <label id="memo-label">内容 / 備考</label>
          <input type="text" id="entry-memo" placeholder="詳細を入力">
        </div>

        <div class="form-group">
          <label>対象者（空欄は家計）</label>
          <select id="entry-person"></select>
        </div>

        <button type="submit" class="submit-btn">保存する</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
