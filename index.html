<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家計簿 DashBoard</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <!-- SVG Symbol Definition -->
  <svg style="display: none;">
    <symbol id="icon-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></symbol>
  </svg>

  <header class="app-header">
    <div class="header-container">
      <h1 class="logo">FinanceApp</h1>
      <nav class="view-switch">
        <button id="btn-view-month" class="nav-btn active">月別表示</button>
        <button id="btn-view-year" class="nav-btn">年別推移</button>
        <button id="btn-open-budget" class="icon-btn" title="予算設定">
          <svg class="icon"><use href="#icon-settings"></use></svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <!-- ナビゲーションバー -->
    <div class="date-navigator">
      <button id="btn-prev" class="icon-btn">
        <svg class="icon"><use href="#icon-chevron-left"></use></svg>
      </button>
      <h2 id="current-period-title" class="period-title">----年--月</h2>
      <button id="btn-next" class="icon-btn">
        <svg class="icon"><use href="#icon-chevron-right"></use></svg>
      </button>
    </div>

    <!-- サマリーカード -->
    <section class="summary-grid">
      <div class="card summary-card income">
        <span class="card-label">総収入</span>
        <span id="summary-income" class="card-value">¥0</span>
      </div>
      <div class="card summary-card expense">
        <span class="card-label">総支出</span>
        <span id="summary-expense" class="card-value">¥0</span>
      </div>
      <div class="card summary-card balance">
        <span class="card-label">収支差額</span>
        <span id="summary-balance" class="card-value">¥0</span>
      </div>
      <div class="card summary-card budget">
        <span class="card-label">予算残り</span>
        <span id="summary-budget-diff" class="card-value">¥0</span>
      </div>
    </section>

    <!-- メイン表示領域（月別） -->
    <section id="view-month-section" class="dashboard-section">
      <div class="card chart-container">
        <h3>カテゴリー別支出 vs 予算</h3>
        <div class="canvas-wrapper">
          <canvas id="expenseChart"></canvas>
        </div>
      </div>
    </section>

    <!-- メイン表示領域（年別） -->
    <section id="view-year-section" class="dashboard-section hidden">
      <div class="card chart-container">
        <h3>年間収支推移</h3>
        <div class="canvas-wrapper">
          <canvas id="yearChart"></canvas>
        </div>
      </div>
    </section>
  </main>

  <!-- 浮遊型アクションボタン (FAB) -->
  <div class="fab-wrapper" id="fab-wrapper">
    <div class="fab-menu" id="fab-menu">
      <button class="fab-item expense" id="btn-open-expense">+ 支出登録</button>
      <button class="fab-item income" id="btn-open-income">+ 収入登録</button>
    </div>
    <button class="fab-main" id="fab-main">
      <svg class="icon"><use href="#icon-plus"></use></svg>
    </button>
  </div>

  <!-- Modal: 支出/収入登録 -->
  <div class="modal-overlay hidden" id="transaction-modal">
    <div class="modal-card">
      <h3 id="modal-title">収支の登録</h3>
      <form id="transaction-form">
        <input type="hidden" id="form-type" value="expense">
        <div class="form-group">
          <label>日付</label>
          <input type="date" id="form-date" required>
        </div>
        <div class="form-group">
          <label>カテゴリー</label>
          <select id="form-category" required></select>
        </div>
        <div class="form-group">
          <label>金額</label>
          <input type="number" id="form-amount" min="1" placeholder="0" required>
        </div>
        <div class="form-group" id="group-payment-method">
          <label>支払方法</label>
          <select id="form-payment-method">
            <option value="AMEX">AMEX</option>
            <option value="現金等">現金等</option>
          </select>
        </div>
        <div class="form-group">
          <label>名簿（対象者）</label>
          <select id="form-member"></select>
        </div>
        <div class="form-group">
          <label>内容 / 備考</label>
          <input type="text" id="form-memo" placeholder="メモを入力">
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="btn-close-modal">キャンセル</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: 予算設定 -->
  <div class="modal-overlay hidden" id="budget-modal">
    <div class="modal-card">
      <h3>月間予算の設定</h3>
      <form id="budget-form">
        <div id="budget-inputs-container" class="budget-inputs-list"></div>
        <div class="budget-total-preview">
          合計予算: <span id="budget-total-sum">¥0</span>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="btn-close-budget-modal">キャンセル</button>
          <button type="submit" class="btn btn-primary">予算を保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
