<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAKEIBO</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-logo">KAKEIBO</div>
      <nav class="nav-tabs">
        <button class="tab-btn active" data-tab="dashboard">
          <svg class="tab-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
          ダッシュボード
        </button>
        <button class="tab-btn" data-tab="expense">
          <svg class="tab-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M19 3H5c-1.11 0-2 .89-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.11-.9-2-2-2zm0 16H5V7h14v12zm-2-7H7v-2h10v2z"/></svg>
          支出
        </button>
        <button class="tab-btn" data-tab="income">
          <svg class="tab-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/></svg>
          収入
        </button>
        <button class="tab-btn" data-tab="categories">
          <svg class="tab-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58.55 0 1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z"/></svg>
          カテゴリー・予算
        </button>
      </nav>
    </div>
  </header>

  <main class="main-container">

    <!-- View 1: ダッシュボード -->
    <section id="view-dashboard" class="tab-content active">
      <div class="section-header">
        <div>
          <span class="sub-title">MONTHLY OVERVIEW</span>
          <h1 class="main-title">今月のくらし</h1>
        </div>
        <div class="month-selector">
          <button id="btn-prev-month" class="arrow-btn">&lt;</button>
          <span id="label-current-month" class="month-display">2026年8月</span>
          <button id="btn-next-month" class="arrow-btn">&gt;</button>
        </div>
      </div>

      <!-- サマリーカード -->
      <div class="summary-cards">
        <div class="card summary-box">
          <span class="card-caption">収入</span>
          <div id="sum-income" class="amount-val">¥0</div>
        </div>
        <div class="card summary-box">
          <span class="card-caption">支出</span>
          <div id="sum-expense" class="amount-val">¥0</div>
        </div>
        <div class="card summary-box">
          <span class="card-caption">収支</span>
          <div id="sum-balance" class="amount-val">¥0</div>
        </div>
      </div>

      <div class="dashboard-subhead">
        <h2>カテゴリー別の支出と予算</h2>
        <span class="budget-total-text">予算合計 <strong id="sum-total-budget">¥0</strong></span>
      </div>

      <!-- カテゴリー予算グリッド -->
      <div id="category-budget-grid" class="category-grid"></div>

      <!-- 人ごとの収入セクション -->
      <div class="dashboard-subhead" style="margin-top: 2.5rem;">
        <h2>人ごとの収入</h2>
      </div>
      <div id="member-income-container" class="member-income-list"></div>
    </section>

    <!-- View 2: 支出一覧 -->
    <section id="view-expense" class="tab-content">
      <div class="section-header">
        <div>
          <span class="sub-title">EXPENSES</span>
          <h1 class="main-title">支出</h1>
        </div>
        <div class="action-toolbar">
          <button class="btn btn-secondary" onclick="openExpenseModal()">+ 現金などを手入力</button>
        </div>
      </div>

      <div class="list-filter-bar">
        <div class="month-selector">
          <button class="arrow-btn" onclick="changeMonth(-1)">&lt;</button>
          <span class="month-display current-month-text">2026年8月</span>
          <button class="arrow-btn" onclick="changeMonth(1)">&gt;</button>
        </div>
        <div class="list-stats" id="expense-stats">0件 / ¥0</div>
      </div>

      <div id="expense-list-container" class="item-list"></div>
    </section>

    <!-- View 3: 収入一覧 -->
    <section id="view-income" class="tab-content">
      <div class="section-header">
        <div>
          <span class="sub-title">INCOME</span>
          <h1 class="main-title">収入</h1>
        </div>
        <div class="action-toolbar">
          <button class="btn btn-primary" onclick="openIncomeModal()">+ 収入を追加</button>
        </div>
      </div>

      <div class="list-filter-bar">
        <div class="month-selector">
          <button class="arrow-btn" onclick="changeMonth(-1)">&lt;</button>
          <span class="month-display current-month-text">2026年8月</span>
          <button class="arrow-btn" onclick="changeMonth(1)">&gt;</button>
        </div>
        <div class="list-stats" id="income-stats">0件 / ¥0</div>
      </div>

      <div id="income-list-container" class="item-list"></div>
    </section>

    <!-- View 4: カテゴリー・予算管理 -->
    <section id="view-categories" class="tab-content">
      <div class="section-header">
        <div>
          <span class="sub-title">CATEGORIES</span>
          <h1 class="main-title">カテゴリー・予算</h1>
        </div>
      </div>

      <div class="card add-category-card" style="margin-bottom: 2rem;">
        <form id="form-add-category" class="inline-form">
          <select id="new-cat-type" class="form-control">
            <option value="支出">支出</option>
            <option value="収入">収入</option>
          </select>
          <input type="text" id="new-cat-name" class="form-control" placeholder="カテゴリー名" required>
          <input type="number" id="new-cat-budget" class="form-control" placeholder="月の予算（支出のみ）">
          <button type="submit" class="btn btn-primary">+ 追加</button>
        </form>
      </div>

      <h2 class="subhead-title">支出カテゴリー</h2>
      <div id="exp-category-manage-list" class="item-list" style="margin-bottom: 2.5rem;"></div>

      <h2 class="subhead-title">収入カテゴリー</h2>
      <div id="inc-category-manage-list" class="item-list"></div>
    </section>

  </main>

  <!-- Modal: 手入力モーダル -->
  <div id="modal-transaction" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 id="modal-tx-title">データ入力</h3>
      <form id="form-transaction">
        <input type="hidden" id="tx-type" value="expense">
        <div class="form-group">
          <label>日付</label>
          <input type="date" id="tx-date" class="form-control" required>
        </div>
        <div class="form-group">
          <label>カテゴリー</label>
          <select id="tx-category" class="form-control" required></select>
        </div>
        <div class="form-group">
          <label>金額</label>
          <input type="number" id="tx-amount" class="form-control" placeholder="0" required>
        </div>
        <div class="form-group">
          <label>担当者（名簿）</label>
          <select id="tx-member" class="form-control"></select>
        </div>
        <div class="form-group">
          <label>内容 / 備考</label>
          <input type="text" id="tx-memo" class="form-control" placeholder="例: トイレットペーパー">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeTxModal()">キャンセル</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
