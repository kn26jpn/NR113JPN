<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スマート家計簿</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Chart.js 読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- ヘッダー -->
  <header class="navbar">
    <h1 class="logo">
      <svg class="icon" viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
      家計簿
    </h1>
    <nav class="nav-tabs">
      <button id="tab-monthly" class="tab-btn active" onclick="switchTab('monthly')">月別</button>
      <button id="tab-annual" class="tab-btn" onclick="switchTab('annual')">年間分析</button>
      <button id="tab-settings" class="icon-btn" onclick="openSettings()" title="設定">
        <svg class="icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </button>
    </nav>
  </header>

  <!-- メインコンテンツ -->
  <main class="container">
    
    <!-- 1. 月別ビュー -->
    <section id="view-monthly" class="view-section active">
      <div class="month-picker-bar">
        <button class="btn-circle" onclick="changeMonth(-1)">&#10094;</button>
        <h2 id="current-month-display">2026年07月</h2>
        <button class="btn-circle" onclick="changeMonth(1)">&#10095;</button>
      </div>

      <div class="summary-cards">
        <div class="card income">
          <span class="label">今月の収入</span>
          <span class="amount" id="total-income">¥0</span>
        </div>
        <div class="card expense">
          <span class="label">今月の支出</span>
          <span class="amount" id="total-expense">¥0</span>
        </div>
        <div class="card balance">
          <span class="label">収支差額</span>
          <span class="amount" id="total-balance">¥0</span>
        </div>
      </div>

      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>日付</th>
              <th>種別</th>
              <th>カテゴリー</th>
              <th>内容 / 備考</th>
              <th>支払方法</th>
              <th>対象</th>
              <th class="text-right">金額</th>
            </tr>
          </thead>
          <tbody id="monthly-list-body">
            <tr><td colspan="7" class="text-center">データを読み込み中...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- 2. 年間分析ビュー -->
    <section id="view-annual" class="view-section">
      <div class="month-picker-bar">
        <button class="btn-circle" onclick="changeYear(-1)">&#10094;</button>
        <h2 id="current-year-display">2026年</h2>
        <button class="btn-circle" onclick="changeYear(1)">&#10095;</button>
      </div>

      <div class="charts-grid">
        <div class="chart-card">
          <h3>月別収支推移</h3>
          <div class="chart-wrapper"><canvas id="barChart"></canvas></div>
        </div>
        <div class="chart-card">
          <h3>支出カテゴリー内訳</h3>
          <div class="chart-wrapper"><canvas id="pieChart"></canvas></div>
        </div>
      </div>
    </section>

  </main>

  <!-- 右下 FAB (Floating Action Button) -->
  <div class="fab-container">
    <div class="fab-options" id="fab-options">
      <button class="fab-child expense" onclick="openModal('expense')">
        <span>支出を追加</span>
        <svg class="icon" viewBox="0 0 24 24"><path d="M19 13H13V19H11V13H5V11H11V5H13V11H19V13Z"/></svg>
      </button>
      <button class="fab-child income" onclick="openModal('income')">
        <span>収入を追加</span>
        <svg class="icon" viewBox="0 0 24 24"><path d="M19 13H13V19H11V13H5V11H11V5H13V11H19V13Z"/></svg>
      </button>
    </div>
    <button class="fab-main" id="fab-main" onclick="toggleFab()">
      <svg class="icon" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>
  </div>

  <!-- モーダル: データ入力 -->
  <div id="entry-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">収支の登録</h3>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <form id="entry-form" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="form-type" value="expense">
        
        <div class="form-group">
          <label for="form-date">日付</label>
          <input type="date" id="form-date" required>
        </div>

        <div class="form-group">
          <label for="form-category">カテゴリー</label>
          <select id="form-category" required></select>
        </div>

        <div class="form-group">
          <label for="form-amount">金額 (円)</label>
          <input type="number" id="form-amount" min="1" placeholder="1000" required>
        </div>

        <div class="form-group" id="group-payment-method">
          <label for="form-payment-method">支払方法</label>
          <select id="form-payment-method">
            <option value="現金">現金</option>
            <option value="カード">カード</option>
            <option value="ポイント">ポイント</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <div class="form-group">
          <label for="form-memo">内容 / 備考</label>
          <input type="text" id="form-memo" placeholder="ランチ代など">
        </div>

        <div class="form-group">
          <label for="form-name">対象（空白=家計）</label>
          <select id="form-name">
            <option value="">家計（指定なし）</option>
          </select>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeModal()">キャンセル</button>
          <button type="submit" class="btn-primary" id="submit-btn">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <!-- モーダル: API設定 -->
  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>API接続設定</h3>
        <button class="close-btn" onclick="closeSettings()">&times;</button>
      </div>
      <div class="form-group">
        <label for="setting-gas-url">GAS Web App URL</label>
        <input type="text" id="setting-gas-url" placeholder="https://script.google.com/macros/s/.../exec">
      </div>
      <div class="form-group">
        <label for="setting-token">API Token</label>
        <input type="password" id="setting-token" placeholder="トークンを入力">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-primary" onclick="saveSettings()">設定を保存</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
