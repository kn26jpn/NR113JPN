<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div id="app" class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
        <span class="brand-title">Ledger</span>
      </div>

      <div class="header-controls">
        <div class="month-selector">
          <button id="prev-month" class="btn-icon" aria-label="前月">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <span id="month-display" class="month-label">2026年 7月</span>
          <button id="next-month" class="btn-icon" aria-label="翌月">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>

        <button id="btn-open-budget" class="btn btn-outline" style="font-size: 0.8rem; padding: 6px 12px;">予算設定</button>

        <nav class="view-toggle">
          <button id="btn-monthly-view" class="toggle-tab active">月別表示</button>
          <button id="btn-annual-view" class="toggle-tab">年間分析</button>
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-content">
      <!-- Monthly View -->
      <section id="monthly-view" class="view-section active">
        <!-- Dashboard Summary -->
        <div class="summary-grid">
          <div class="summary-card income">
            <div class="card-meta">
              <span class="card-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 15-6-6-6 6"/></svg>
              </span>
              <span class="card-title">今月の総収入</span>
            </div>
            <div class="card-value" id="sum-income">¥0</div>
          </div>

          <div class="summary-card expense">
            <div class="card-meta">
              <span class="card-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
              </span>
              <span class="card-title">今月の総支出</span>
            </div>
            <div class="card-value" id="sum-expense">¥0</div>
          </div>

          <div class="summary-card balance">
            <div class="card-meta">
              <span class="card-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
              </span>
              <span class="card-title">今月の収支差額</span>
            </div>
            <div class="card-value" id="sum-total">¥0</div>
          </div>
        </div>

        <!-- 今月の支出カテゴリー（縦棒グラフ＋予算ライン） -->
        <div class="content-card chart-card-monthly mb-6">
          <div class="card-header">
            <h2 class="card-heading">今月の支出カテゴリー vs 予算</h2>
          </div>
          <div class="chart-wrapper-monthly">
            <canvas id="monthly-category-chart"></canvas>
          </div>
        </div>

        <!-- Transactions List -->
        <div class="content-card">
          <div class="card-header">
            <h2 class="card-heading">取引履歴</h2>
            <span class="badge" id="transaction-count">0 件</span>
          </div>
          <div id="transaction-list" class="transaction-list">
            <!-- Dynamic Injection -->
          </div>
        </div>
      </section>

      <!-- Annual View -->
      <section id="annual-view" class="view-section">
        <div class="annual-grid">
          <div class="content-card chart-card">
            <div class="card-header">
              <h2 class="card-heading">年間支出カテゴリー分析</h2>
            </div>
            <div class="chart-wrapper">
              <canvas id="category-chart"></canvas>
            </div>
          </div>
          <div class="content-card">
            <div class="card-header">
              <h2 class="card-heading">カテゴリー別内訳</h2>
            </div>
            <div id="category-breakdown" class="breakdown-list">
              <!-- Dynamic Injection -->
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Floating Action Button (FAB) -->
    <div class="fab-wrapper">
      <div class="fab-menu" id="fab-menu">
        <button class="fab-action expense" onclick="openModal('expense')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          <span>支出を記録</span>
        </button>
        <button class="fab-action income" onclick="openModal('income')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          <span>収入を記録</span>
        </button>
      </div>
      <button class="fab-trigger" id="fab-trigger" aria-label="新規追加">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <!-- Modal Overlay & Modals -->
    <div id="modal-backdrop" class="modal-backdrop"></div>

    <!-- Expense Modal -->
    <div id="modal-expense" class="modal-window">
      <div class="modal-header">
        <h3 class="modal-title">支出の登録</h3>
        <button class="btn-icon" onclick="closeModals()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="form-expense" class="modal-body">
        <div class="form-group">
          <label class="form-label">日付</label>
          <input type="date" name="date" class="form-input" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">カテゴリー</label>
            <select name="category" class="form-select" required><option value="" disabled selected>選択</option></select>
          </div>
          <div class="form-group">
            <label class="form-label">支払方法</label>
            <select name="payment" class="form-select" required>
              <option value="現金" selected>現金</option>
              <option value="カード">カード</option>
              <option value="ポイント">ポイント</option>
              <option value="その他">その他</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">内容</label>
          <input type="text" name="content" class="form-input" placeholder="例: スーパーで買物" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">金額 (円)</label>
            <input type="number" name="amount" class="form-input" placeholder="0" min="1" required>
          </div>
          <div class="form-group">
            <label class="form-label">負担者</label>
            <select name="name" class="form-select"><option value="">家計（共通）</option></select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="closeModals()">キャンセル</button>
          <button type="submit" class="btn btn-primary">保存する</button>
        </div>
      </form>
    </div>

    <!-- Income Modal -->
    <div id="modal-income" class="modal-window">
      <div class="modal-header">
        <h3 class="modal-title">収入の登録</h3>
        <button class="btn-icon" onclick="closeModals()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="form-income" class="modal-body">
        <div class="form-group">
          <label class="form-label">日付</label>
          <input type="date" name="date" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">カテゴリー</label>
          <select name="category" class="form-select" required><option value="" disabled selected>選択</option></select>
        </div>
        <div class="form-group">
          <label class="form-label">備考 / 内容</label>
          <input type="text" name="note" class="form-input" placeholder="例: 7月分給与">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">金額 (円)</label>
            <input type="number" name="amount" class="form-input" placeholder="0" min="1" required>
          </div>
          <div class="form-group">
            <label class="form-label">帰属</label>
            <select name="name" class="form-select"><option value="">家計（共通）</option></select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="closeModals()">キャンセル</button>
          <button type="submit" class="btn btn-primary">保存する</button>
        </div>
      </form>
    </div>

    <!-- Edit Category Modal -->
    <div id="modal-edit-category" class="modal-window">
      <div class="modal-header">
        <h3 class="modal-title">カテゴリーの変更</h3>
        <button class="btn-icon" onclick="closeModals()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="form-edit-category" class="modal-body">
        <input type="hidden" name="sheetName">
        <input type="hidden" name="rowIndex">
        <div class="form-group">
          <label class="form-label">内容</label>
          <input type="text" id="edit-content-display" class="form-input" readonly style="background: var(--bg-app);">
        </div>
        <div class="form-group">
          <label class="form-label">新しいカテゴリー</label>
          <select name="newCategory" id="edit-category-select" class="form-select" required></select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="closeModals()">キャンセル</button>
          <button type="submit" class="btn btn-primary">更新する</button>
        </div>
      </form>
    </div>

    <!-- Budget Setting Modal -->
    <div id="modal-budget" class="modal-window">
      <div class="modal-header">
        <h3 class="modal-title"><span id="budget-month-label"></span> のカテゴリー別予算</h3>
        <button class="btn-icon" onclick="closeModals()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="form-budget" class="modal-body">
        <div id="budget-input-list" style="display: flex; flex-direction: column; gap: 12px; max-height: 320px; overflow-y: auto;">
          <!-- Dynamic Injection -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="closeModals()">キャンセル</button>
          <button type="submit" class="btn btn-primary">予算を保存</button>
        </div>
      </form>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
