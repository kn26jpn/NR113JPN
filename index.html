<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Kakeibo</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header>
      <button id="prev-month" class="icon-btn">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
      <h1 id="month-display">2026年 7月</h1>
      <button id="next-month" class="icon-btn">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
      </button>
      <button id="toggle-view" class="btn-text">年間分析</button>
    </header>

    <!-- Monthly View -->
    <main id="monthly-view" class="view active">
      <div class="summary-cards">
        <div class="card income">収入: <span id="sum-income">¥0</span></div>
        <div class="card expense">支出: <span id="sum-expense">¥0</span></div>
        <div class="card total">収支: <span id="sum-total">¥0</span></div>
      </div>
      <div id="transaction-list" class="list-container"></div>
    </main>

    <!-- Annual View -->
    <main id="annual-view" class="view">
      <div class="chart-container">
        <canvas id="annual-chart"></canvas>
      </div>
    </main>

    <!-- Floating Action Button -->
    <div class="fab-container">
      <div class="fab-menu" id="fab-menu">
        <button class="fab-item expense" onclick="openModal('expense')">支出</button>
        <button class="fab-item income" onclick="openModal('income')">収入</button>
      </div>
      <button class="fab" id="fab-main">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </button>
    </div>

    <!-- Modals -->
    <div id="modal-overlay" class="modal-overlay"></div>
    
    <!-- Expense Modal -->
    <div id="expense-modal" class="modal">
      <h2>支出の登録</h2>
      <form id="expense-form">
        <input type="date" name="date" required>
        <select name="category" required><option value="" disabled selected>カテゴリー</option></select>
        <input type="text" name="content" placeholder="内容" required>
        <select name="payment" required>
          <option value="" disabled selected>支払方法</option>
          <option value="現金">現金</option>
          <option value="カード">カード</option>
          <option value="ポイント">ポイント</option>
          <option value="その他">その他</option>
        </select>
        <input type="number" name="amount" placeholder="金額 (¥)" required>
        <select name="name"><option value="">家計（指定なし）</option></select>
        <div class="modal-actions">
          <button type="button" class="cancel-btn" onclick="closeModals()">キャンセル</button>
          <button type="submit" class="submit-btn">登録</button>
        </div>
      </form>
    </div>

    <!-- Income Modal -->
    <div id="income-modal" class="modal">
      <h2>収入の登録</h2>
      <form id="income-form">
        <input type="date" name="date" required>
        <select name="category" required><option value="" disabled selected>カテゴリー</option></select>
        <input type="text" name="note" placeholder="備考" required>
        <input type="number" name="amount" placeholder="金額 (¥)" required>
        <select name="name"><option value="">家計（指定なし）</option></select>
        <div class="modal-actions">
          <button type="button" class="cancel-btn" onclick="closeModals()">キャンセル</button>
          <button type="submit" class="submit-btn">登録</button>
        </div>
      </form>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
